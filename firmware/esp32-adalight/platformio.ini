; AmbientLight ESP32 Adalight receiver.
;
;   pio run -e esp32dev -t upload       build and flash a classic ESP32 DevKit (USB-UART bridge)
;   pio run -e esp32-s3 -t upload       ESP32-S3 DevKitC on its native USB port (baud rate irrelevant)
;   pio test -e native                  run the protocol/watchdog unit tests on the PC
;
; Versions are pinned so a build today and a build in a year produce the same firmware.

[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32@7.1.3
framework = arduino
lib_deps = makuna/NeoPixelBus@2.8.4
monitor_speed = 1000000
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
